name: test-suite

# [P113 (6/6) Milestone 4 2026-04-27] Run the property-style invariant
# tests + chaos harness on every push. Fast (~30s total) so it doesn't
# slow PRs. Catches regressions on every P-fix shipped P90→P113.
#
# Companion to codebase-invariants.yml (scanner gate). This workflow
# runs the actual pytest invariant + chaos suites; that one runs the
# static scanners.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test deps
        run: |
          python -m pip install --upgrade pip
          # Pinned versions so test runs are reproducible. Mypy is for
          # the lint_mypy_baseline scanner; pydantic for config_schema;
          # hypothesis for P117 property tests + P119 fuzz harness.
          pip install pytest pytest-asyncio pydantic mypy hypothesis

      # P111 invariant tests — the regression suite that turns every
      # P-fix into a forcing function. If one fails, a P-fix was
      # silently reverted.
      - name: P111 invariant tests
        run: |
          python -X utf8 -m pytest tests/test_invariants_p111.py -v

      # P113 schema + contract + signaling + mutation + replay-threshold
      - name: P113 test infrastructure
        run: |
          python -X utf8 -m pytest \
            tests/test_config_schema.py \
            tests/test_external_api_contracts.py \
            tests/test_mock_fallback_signaling.py \
            tests/test_mutation_audit_p113.py \
            tests/test_replay_regression_threshold.py \
            -v

      # Chaos harness — deliberate injection of failure modes that
      # actually hit production this session.
      - name: Chaos test harness
        run: |
          python -X utf8 -m pytest tests/chaos/ -v

      # P116-P119 (Tier A confidence push): replay golden-trace + Hypothesis
      # property tests + JSON fuzz tests. Caught the P118 0.0-or-0.5 bug.
      - name: P116 fusion replay (golden trace)
        run: |
          python -X utf8 -m pytest tests/test_replay_fusion.py -v

      - name: P117 Hypothesis property tests
        run: |
          python -X utf8 -m pytest tests/test_property_invariants.py -v

      - name: P119 external API fuzz tests
        run: |
          python -X utf8 -m pytest tests/test_external_api_fuzz.py -v

      # P121-P123 (Tier A3 + Tier C7-C8): trade-gate coverage + extended
      # mutation audit + concurrent-stress safety net.
      - name: P121 trade-gate coverage tests
        run: |
          python -X utf8 -m pytest tests/test_trade_gate_coverage_p121.py -v

      - name: P122 mutation audit (extended)
        run: |
          python -X utf8 -m pytest tests/test_mutation_audit_p122.py -v

      - name: P123 concurrent stress
        run: |
          python -X utf8 -m pytest tests/test_concurrent_stress.py -v
