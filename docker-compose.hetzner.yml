# HMATS v6.8.0 — Hetzner Cloud Compose
# Usage:
#   docker compose -f docker-compose.hetzner.yml up -d
#   docker compose -f docker-compose.hetzner.yml logs -f hmats-engine
#   docker compose -f docker-compose.hetzner.yml down

services:
  hmats-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    image: hmats-engine:6.8.0
    container_name: hmats-engine
    restart: unless-stopped
    env_file: .env
    environment:
      - HMATS_BASE_DIR=/opt/hmats
      - HMATS_STATE_DIR=/opt/hmats/data
      - HMATS_LOG_DIR=/opt/hmats/logs
      - HMATS_MODEL_DIR=/opt/hmats/models
      - HMATS_CONFIG_FILE=/opt/hmats/configs/live_high_risk.json
      - HMATS_RUNTIME_MODE=PROD
      # [P415b] persist the HF cache so the DeBERTa base downloads ONCE,
      # not on every --force-recreate (the P415 startup-hang root cause).
      - HF_HOME=/opt/hmats/hfcache
    volumes:
      - hmats-models:/opt/hmats/models:ro
      - hmats-data:/opt/hmats/data
      - hmats-logs:/opt/hmats/logs
      - hmats-hfcache:/opt/hmats/hfcache
    command: ["--mode", "live", "--config", "configs/live_high_risk.json", "--confirm-live"]
    deploy:
      resources:
        limits:
          cpus: "1.7"   # CPX21 has 2 vCPU; reserve 0.3 for hmats-api + system
          memory: 3G    # CPX21 has 4GB total; reserve 1GB for system + api
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    # [FIX 2026-04-25] Healthcheck flipped from YAML `>` folded scalar to
    # exec-form list. The folded form preserved leading whitespace from each
    # line, and `python -c` reads the whole string as a single program — the
    # leading spaces looked like an indented block, throwing IndentationError
    # on every probe. Container stayed `health: starting` indefinitely.
    # Exec form passes the script as a single shell token (no folding).
    # [P382] Existence-only was not a liveness check: a process frozen for a
    # day still had a dashboard_state.json with an `updated_at` key. The
    # probe now also requires `updated_at` to be younger than 8h (two 4H
    # ticks — one missed tick is tolerated, two are not). The stamp is
    # written as `...Z` (P323); parsed tz-aware.
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from pathlib import Path; from datetime import datetime, timezone; s = Path('/opt/hmats/data/dashboard_state.json'); d = json.loads(s.read_text()); u = d['updated_at']; t = datetime.fromisoformat(str(u).replace('Z', '+00:00')); t = t if t.tzinfo else t.replace(tzinfo=timezone.utc); age = (datetime.now(timezone.utc) - t).total_seconds(); assert age < 8*3600, f'dashboard_state.json updated_at is {age:.0f}s old (>8h)'; print(f'OK age={age:.0f}s')"]
      interval: 120s
      timeout: 10s
      start_period: 180s
      retries: 3

  hmats-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: hmats-api:6.8.0
    container_name: hmats-api
    restart: unless-stopped
    environment:
      - HMATS_BASE_DIR=/opt/hmats
      - HMATS_STATE_DIR=/opt/hmats/data
      - HMATS_LOG_DIR=/opt/hmats/logs
    volumes:
      - hmats-data:/opt/hmats/data:ro
      - hmats-logs:/opt/hmats/logs:ro
    ports:
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      hmats-engine:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # [FIX 2026-04-22] Declared `external` so compose reuses the existing
  # hmats-models volume (synced by scripts/hetzner_deploy.sh) instead of
  # creating a new, empty `app_hmats-models`. Without this, DRL models
  # silently failed to load (models_ready=0 → DRL stuck in SHADOW).
  hmats-models:
    external: true
    name: hmats-models
  hmats-data:
    external: true
    name: hmats-data
  hmats-logs:
    external: true
    name: hmats-logs
  # [P415b] Managed (not external): compose creates it on first `up`,
  # it survives --force-recreate, and nothing external needs to sync it.
  hmats-hfcache:
    name: hmats-hfcache
